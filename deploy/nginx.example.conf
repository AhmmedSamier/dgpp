# Example only: supply your own DNS name, TLS certificate and password file.
# Include inside nginx's http context; keep DGPP bound to 127.0.0.1:18080.
server {
    listen 443 ssl;
    server_name inference.example.com;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    auth_basic "DGPP";
    auth_basic_user_file /etc/nginx/dgpp.htpasswd;
    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
